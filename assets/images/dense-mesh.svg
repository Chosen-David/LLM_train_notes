<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title"><title id="title">普通参数 FSDP 包含 dp_shard 与 CP，固定 TP 坐标</title><rect width="1040" height="520" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#172b4d"><text x="32" y="42" font-size="24" font-weight="700">普通参数：4 × 2 × 2 = 16 GPU</text><text x="32" y="76" font-size="17">固定 PP=0、DP replica=0；绿色为 GPU 0 的默认 FSDP 组</text><text x="32" y="134" font-size="17">dp_shard=0</text><rect x="210" y="102" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="228" y="135" font-size="19">GPU 0</text><rect x="370" y="102" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="388" y="135" font-size="19">GPU 1</text><rect x="580" y="102" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="598" y="135" font-size="19">GPU 2</text><rect x="740" y="102" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="758" y="135" font-size="19">GPU 3</text><text x="32" y="210" font-size="17">dp_shard=1</text><rect x="210" y="178" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="228" y="211" font-size="19">GPU 4</text><rect x="370" y="178" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="388" y="211" font-size="19">GPU 5</text><rect x="580" y="178" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="598" y="211" font-size="19">GPU 6</text><rect x="740" y="178" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="758" y="211" font-size="19">GPU 7</text><text x="32" y="286" font-size="17">dp_shard=2</text><rect x="210" y="254" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="228" y="287" font-size="19">GPU 8</text><rect x="370" y="254" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="388" y="287" font-size="19">GPU 9</text><rect x="580" y="254" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="598" y="287" font-size="19">GPU 10</text><rect x="740" y="254" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="758" y="287" font-size="19">GPU 11</text><text x="32" y="362" font-size="17">dp_shard=3</text><rect x="210" y="330" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="228" y="363" font-size="19">GPU 12</text><rect x="370" y="330" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="388" y="363" font-size="19">GPU 13</text><rect x="580" y="330" width="142" height="54" rx="9" fill="#d3efe7" stroke="#188468"/><text x="598" y="363" font-size="19">GPU 14</text><rect x="740" y="330" width="142" height="54" rx="9" fill="#e3e8f0" stroke="#bac7d8"/><text x="758" y="363" font-size="19">GPU 15</text><text x="230" y="432" font-size="18">CP=0（TP=0 / 1）</text><text x="600" y="432" font-size="18">CP=1（TP=0 / 1）</text><text x="32" y="482" font-size="20" font-weight="700">GPU 0 的 FSDP 组 = {0, 2, 4, 6, 8, 10, 12, 14}</text></g></svg>